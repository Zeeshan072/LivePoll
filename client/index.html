<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LivePoll — Create and share real-time polls with instant results" />
    <title>LivePoll — Real-Time Polling</title>
  </head>
  <body>
    <!--
      This is the single HTML file for our React app.
      React will mount itself into the <div id="root"> element.
      Everything you see in the browser is rendered by React
      into this div — the HTML file itself stays almost empty.
    -->
    <div id="root"></div>

    <!--
      This script tag loads our React app.
      Vite processes src/main.jsx and bundles everything together.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
